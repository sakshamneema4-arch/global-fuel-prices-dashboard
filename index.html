<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Fuel Prices Dashboard</title>

    <!-- Tableau Embedding API -->
    <script
        type="module"
        src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #ffffff;
        }

        header {
            background: linear-gradient(135deg, #111c35, #173b5e);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #294566;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: #b8c9df;
            font-size: 15px;
        }

        .stats {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 22px 15px 5px;
        }

        .stat-card {
            background: #17243a;
            border: 1px solid #2a405e;
            border-radius: 12px;
            padding: 18px 24px;
            min-width: 180px;
            text-align: center;
        }

        .stat-card h3 {
            color: #67d5d0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
        }

        .section-title {
            padding: 25px 22px 12px;
            font-size: 21px;
        }

        .dashboard-container {
            margin: 0 18px 25px;
            padding: 12px;
            background: #111c30;
            border: 1px solid #2a405e;
            border-radius: 12px;
        }

        tableau-viz {
            display: block;
            width: 100%;
            height: 800px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #8fa3bd;
            font-size: 13px;
            border-top: 1px solid #26364e;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 24px;
            }

            .stat-card {
                width: 100%;
            }

            .dashboard-container {
                margin: 0 8px 20px;
                padding: 5px;
            }

            tableau-viz {
                height: 650px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Global Fuel Prices</h1>
        <p>Global Fuel Price Analysis | 2020–2026</p>
    </header>

    <section class="stats">
        <div class="stat-card">
            <h3>Fuel Price Analysis</h3>
            <p>Global</p>
        </div>

        <div class="stat-card">
            <h3>Data Coverage</h3>
            <p>2020–2026</p>
        </div>

        <div class="stat-card">
            <h3>Regional Insights</h3>
            <p>Worldwide</p>
        </div>
    </section>

    <h2 class="section-title">Interactive Tableau Story</h2>

    <div class="dashboard-container">

        <!-- Replace this URL with your published Tableau Story URL -->
        <tableau-viz
            id="fuelDashboard"
            src="https://public.tableau.com/views/GLOBALFUELINTELLIGENCE/GLOBALFUELINTELLIGENCE?:language=en-US&:sid=&:redirect=auth&:display_count=n&:origin=viz_share_link"
            toolbar="bottom"
            hide-tabs>
        </tableau-viz>

    </div>

    <footer>
        Global Fuel Prices Dashboard | Data Visualization Project
    </footer>

</body>
</html>
